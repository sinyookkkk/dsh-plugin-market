name: build dsh plugin market

on:
  push:
    branches: [main, master]
    paths:
      - plugins.txt
      - categories.json
      - package.json
      - scripts/build.sh
      - scripts/apply-market-metadata.mjs
      - scripts/apply-market-metadata.test.mjs
      - .github/workflows/build-market.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dsh-plugin-market
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DSH_MARKET_TITLE: DSH Plugin Market
      DSH_MARKET_DESCRIPTION: deepseek plugin market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack enable && corepack prepare pnpm@11.28.5 --activate
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build.sh
      - name: Test market metadata
        run: node --test scripts/*.test.mjs
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "generated index unchanged"
          else
            git commit -m "chore: update generated plugin index"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
